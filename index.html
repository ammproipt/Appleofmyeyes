  <style>
    body { box-sizing: border-box; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
    .star { animation: twinkle 3s infinite; }
    .star:nth-child(2) { animation-delay: 0.5s; }
    .star:nth-child(3) { animation-delay: 1s; }
    .star:nth-child(4) { animation-delay: 1.5s; }
    .star:nth-child(5) { animation-delay: 2s; }
    .silhouette { animation: float 4s ease-in-out infinite; }
    .pulse-ring { animation: pulseRing 2s infinite; }
    @keyframes pulseRing { 
      0% { box-shadow: 0 0 0 0 rgba(162, 51, 110, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(162, 51, 110, 0); }
      100% { box-shadow: 0 0 0 0 rgba(162, 51, 110, 0); }
    }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    .fade-in { animation: fadeIn 0.6s ease forwards; opacity: 0; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>

   <div class="absolute inset-0 pointer-events-none">
    <svg width="100%" height="100%" style="position: absolute; top: 0; left: 0;"><defs>

     <p class="text-sm mb-8" style="font-family: 'Poppins', sans-serif; color: #c9a3c9;">Enter the secret code</p>
    </div><!-- Password Input -->
    <div class="fade-in" style="animation-delay: 0.4s;"><input type="password" id="password-input" placeholder="ddmmyyyy" class="w-full px-6 py-4 rounded-2xl border-2 text-center text-2xl tracking-widest font-bold focus:outline-none transition-all" style="font-family: 'Poppins', sans-serif; border-color: #a2336e; background: rgba(255, 255, 255, 0.05); color: #ffd4e5; letter-spacing: 4px;" onkeypress="if(event.key==='Enter') submitPassword()">
    </div><!-- Hint -->
    <div class="fade-in mt-4" style="animation-delay: 0.5s;">
     <p id="hint-text" class="text-xs italic" style="font-family: 'Poppins', sans-serif; color: #a2336e;">💡 Hint: It's the day we got married</p>
    </div><!-- Submit Button -->
    <div class="fade-in mt-8" style="animation-delay: 0.6s;"><button onclick="submitPassword()" class="w-full py-4 px-6 rounded-2xl text-white font-bold tracking-wider transition-all hover:scale-105 hover:shadow-lg active:scale-95 pulse-ring" style="font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #a2336e, #d946a6);"> <span class="flex items-center justify-center gap-2"> <i data-lucide="lock-open" style="width:20px;height:20px;"></i> Unlock </span> </button>
    </div><!-- Error Message -->
    <div id="error-message" class="hidden mt-4 fade-in" style="animation-delay: 0.7s;">
     <p class="text-sm" style="font-family: 'Poppins', sans-serif; color: #ff6b9d;">❌ Wrong code. Try again!</p>
    </div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      hint_text: "It's the day we got married"
    };

    function applyConfig(config) {
      const hintElement = document.getElementById('hint-text');
      const hintText = config.hint_text || defaultConfig.hint_text;
      hintElement.textContent = `💡 Hint: ${hintText}`;
    }

    window.elementSdk.init({
      defaultConfig,
      onConfigChange: async (config) => applyConfig(config),
      mapToCapabilities: (config) => ({
        recolorables: [],
        borderables: [],
        fontEditable: undefined,
        fontSizeable: undefined
      }),
      mapToEditPanelValues: (config) => new Map([
        ["hint_text", config.hint_text || defaultConfig.hint_text]
      ])
    });

    function submitPassword() {
      const input = document.getElementById('password-input');
      const correctPassword = "11122021";
      const errorMsg = document.getElementById('error-message');

      if (input.value === correctPassword) {
        errorMsg.classList.add('hidden');
        input.disabled = true;
        document.querySelector('button').disabled = true;
        
        // Redirect after a brief delay
        setTimeout(() => {
          window.open('https://s.id/youareappleofmyeyes', '_blank');
        }, 300);
      } else {
        input.classList.add('shake');
        errorMsg.classList.remove('hidden');
        input.value = '';
        input.focus();
        
        setTimeout(() => {
          input.classList.remove('shake');
        }, 300);
      }
    }

    lucide.createIcons();
  </script>
